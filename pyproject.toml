[project]
name = "tempo-homeassistant"
version = "0.2.0"
description = "Development environment for the Tempo Home Assistant integration (not a package)"
requires-python = ">=3.13.2,<3.14"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff>=0.9",
    "mypy>=1.15",
    # Requirements of the core conversation component (not installed by the test plugin),
    # pinned to the versions of the locked Home Assistant 2026.2.3.
    "hassil==3.5.0",
    "home-assistant-intents==2026.1.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components/tempo"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.uv]
# lru-dict 1.3.0 (pinned by HA) has no cp313 Windows wheel; 1.4.1 lets `uv sync` work on
# Windows for ruff/mypy. Tests still need Linux/WSL (Home Assistant imports fcntl).
override-dependencies = ["lru-dict>=1.4.1"]
